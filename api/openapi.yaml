        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, enum: [100, 500, 1000], default: 100 }
        - name: order
          in: query
          schema: { type: string, enum: [asc, desc] }
      responses:
        "200":
          description: Sayfalanmış denetim kaydı listesi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditLogPage" }
        "403": { $ref: "#/components/responses/Problem" }

  /api/v1/audit/logs/{id}:
    get:
      tags: [audit]
      summary: Denetim kaydı detayı
      description: |
        Web karşılığı: GET /dashboard/audit/logs/{id}. İzin: audit:list
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Denetim kaydı
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditLogView" }
        "404": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /api/v1/payments/transactions/{reference}:
    get:
      tags: [payments]
      summary: Ödeme detayı
      description: |
        Web karşılığı: GET /dashboard/payments/transactions/{reference}
        İzin: payments:charge veya payments:list
      security: [{ bearerAuth: [] }]
      parameters:
        - name: reference
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Ödeme kaydı
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentView" }
        "404": { $ref: "#/components/responses/Problem" }

  /api/v1/payments/3ds/initialize:
    post:
      tags: [payments]
      summary: 3DS ödeme başlatma (aktif sağlayıcı)
      description: |
        Web karşılığı: `/dashboard/payments/checkout` GoUI bileşeninin 3DS event akışıdır.
        Gövde aktif sağlayıcıya göre değişir (`iyzico` | `moka`).
        İzin: `payments:charge`
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/IyzicoInit3DSRequest"
                - $ref: "#/components/schemas/MokaInit3DSRequest"
      responses:
        "200":
          description: Başlatma sonucu
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Init3DSResult" }
        "422": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /api/v1/payments/3ds/auth:
    post:
      tags: [payments]
      summary: 3DS tamamlama / durum
      description: |
        Iyzico: callback sonrası auth (manuel çağrı). Moka: ödeme tamamlandıysa özet döner.
        Web karşılığı: POST /dashboard/payments/3ds/auth
        İzin: `payments:charge`
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Complete3DSRequest" }
      responses:
        "200":
          description: Tamamlama sonucu
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Complete3DSResult" }

  /api/v1/payments/3ds/callback:
    post:
      tags: [payments]
      summary: 3DS callback (public)
      description: |
        Iyzico ve Moka banka yönlendirmesi. Kimlik doğrulama yok.
        Kanonik uç (ThreeDSService varsayılan CallbackURL). Yanıt: HTML sonuç sayfası.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: { type: string }
      responses:
        "200":
          description: HTML sonuç sayfası
          content:
            text/html:
              schema: { type: string }

  /api/v1/payments/webhook/iyzico:
    post:
      tags: [payments]
      summary: Iyzico webhook (public, imzalı)
      description: |
        Merchant panelinde bu URL kaydedilir. X-IYZ-SIGNATURE-V3 ile doğrulanır.
        Kanonik uç: POST /api/v1/payments/webhook/iyzico.
      parameters:
        - name: X-IYZ-SIGNATURE-V3
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IyzicoWebhookPayload" }
      responses:
        "200":
          description: Bildirim onaylandı
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IyzicoWebhookResult" }
        "401": { $ref: "#/components/responses/Problem" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: |
        İsteğin tekrarlanmasında çift yan etkiyi önler. Aynı anahtar + aynı gövde → ilk HTTP yanıtı döner.
        Önerilen format: UUID veya iş mantığı anahtarı (sipariş no vb.).
      schema:
        type: string
        maxLength: 255

  responses:
    Problem:
      description: RFC 7807 hata yanıtı
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    Problem:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string }
        errors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }

    ListPageMeta:
      type: object
      properties:
        page: { type: integer, minimum: 1, description: Mevcut sayfa numarası (1 tabanlı) }
        limit: { type: integer, enum: [100, 500, 1000], description: Sayfa başına kayıt sayısı }
        total: { type: integer, format: int64, description: Filtreye uyan toplam kayıt sayısı }
        total_pages: { type: integer, minimum: 0, description: Toplam sayfa sayısı }
        next_cursor:
          type: string
          description: Keyset sonraki sayfa imleci (yalnızca doluysa; örn. users listesi)

    Email:
      type: string
      format: email
      maxLength: 254
      description: Normalize edilmiş küçük harf e-posta (pkg/validation.NormalizeEmail)

    Phone:
      type: string
      pattern: '^\+[1-9][0-9]{7,14}$'
      description: E.164 telefon (pkg/validation.NormalizePhone); boş string telefonu kaldırır
      example: "+905551112233"

    TurnstileToken:
      type: string
      description: Cloudflare Turnstile token (cf-turnstile-response). SEC_TURNSTILE yapılandırıldığında zorunlu.

    LoginRequest:
      type: object
      description: İlk adımda email+password; MFA adımında mfa_challenge+mfa_code gönderilir.
      properties:
        email: { $ref: "#/components/schemas/Email" }
        password: { type: string }
        mfa_code:
          type: string
          description: 6 haneli TOTP veya tek kullanımlık kurtarma kodu
        mfa_challenge:
          type: string
          description: İlk adımın 401 yanıtından alınan, 5 dakika geçerli opak challenge
        turnstile_token: { $ref: "#/components/schemas/TurnstileToken" }
      oneOf:
        - required: [email, password]
        - required: [mfa_challenge, mfa_code]

    MFARequiredResponse:
      type: object
      required: [type, status, detail, mfa_challenge]
      properties:
        type: { type: string, example: auth.mfa_required }
        title: { type: string }
        status: { type: integer, example: 401 }
        detail: { type: string }
        mfa_challenge: { type: string }

    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email: { $ref: "#/components/schemas/Email" }
        turnstile_token: { $ref: "#/components/schemas/TurnstileToken" }

    ResetPasswordRequest:
      type: object
      required: [token, new_password]
      properties:
        token: { type: string }
        new_password: { type: string, minLength: 8, maxLength: 128 }
        turnstile_token: { $ref: "#/components/schemas/TurnstileToken" }

    ResendVerificationRequest:
      type: object
      required: [email]
      properties:
        email: { $ref: "#/components/schemas/Email" }
        turnstile_token: { $ref: "#/components/schemas/TurnstileToken" }

    ChangePasswordRequest:
      type: object
      required: [old_password, new_password]
      properties:
        old_password: { type: string }
        new_password: { type: string, minLength: 8, maxLength: 128 }

    TokenRequest:
      type: object
      required: [token]
      properties:
        token: { type: string }

    MFACodeRequest:
      type: object
      required: [code]
      properties:
        code: { type: string }

    MFASetupResponse:
      type: object
      properties:
        message: { type: string }
        data:
          type: object
          properties:
            secret: { type: string, description: Base32 TOTP paylaşılan sırrı }
            uri: { type: string, description: "otpauth:// URI (QR kod için)" }
            qr_data_uri: { type: string, description: Lokal üretilmiş PNG QR data URI }

    MFAEnableResponse:
      type: object
      properties:
        message: { type: string }
        data:
          type: object
          properties:
            recovery_codes:
              type: array
              description: Yalnızca bu yanıtta gösterilen tek kullanımlık kurtarma kodları
              items: { type: string }

    RegisterRequest:
      type: object
      required: [email, name, password]
      properties:
        email: { $ref: "#/components/schemas/Email" }
        name: { type: string, minLength: 2, maxLength: 100 }
        password: { type: string, minLength: 8, maxLength: 128 }
        phone: { $ref: "#/components/schemas/Phone" }
        preferred_locale:
          type: string
          example: tr
          description: İsteğe bağlı; boşsa Accept-Language / varsayılan dil kullanılır
        turnstile_token: { $ref: "#/components/schemas/TurnstileToken" }

    AdminCreateRequest:
      allOf:
        - { $ref: "#/components/schemas/RegisterRequest" }
        - type: object
          required: [role]
          properties:
            role:
              type: string
              description: Hedef rol adı. Geçerli değerler GET /api/v1/rbac/roles ile listelenir.
              example: editor

    IntegrationProviderRow:
      type: object
      properties:
        name: { type: string }
        label: { type: string }
        description: { type: string }
        active: { type: boolean }
        configured: { type: boolean }

    SMSProviderListView:
      type: object
      properties:
        active_provider: { type: string, enum: [netgsm, iletimerkezi] }
        providers:
          type: array
          items: { $ref: "#/components/schemas/IntegrationProviderRow" }
        netgsm_configured: { type: boolean }
        iletimerkezi_configured: { type: boolean }

    SMSProviderDetailView:
      type: object
      properties:
        provider: { $ref: "#/components/schemas/IntegrationProviderRow" }
        netgsm_configured: { type: boolean }
        iletimerkezi_configured: { type: boolean }

    SelectSMSProviderRequest:
      type: object
      required: [provider]
      properties:
        provider: { type: string, enum: [netgsm, iletimerkezi] }
        set_active: { type: boolean, default: false }

    PaymentProviderListView:
      type: object
      properties:
        active_provider: { type: string, enum: [iyzico, moka] }
        providers:
          type: array
          items: { $ref: "#/components/schemas/IntegrationProviderRow" }

        iyzico_configured: { type: boolean }
        moka_configured: { type: boolean }

    PaymentProviderDetailView:
      type: object
      properties:
        provider: { $ref: "#/components/schemas/IntegrationProviderRow" }

    SelectPaymentProviderRequest:
      type: object
      required: [provider]
      properties:
        provider: { type: string, enum: [iyzico, moka] }
        set_active: { type: boolean, default: false }

    BinCheckRequest:
      type: object
      required: [binNumber]
      properties:
        locale: { type: string }
        binNumber: { type: string, minLength: 6, maxLength: 19, description: "İlk 6–8 hane; Moka otomatik 8 haneye keser" }
        price: { type: string, description: "Iyzico taksit sorgusu için zorunlu; Moka için opsiyonel" }

    BinCheckResult:
      type: object
      properties:
        provider: { type: string, enum: [iyzico, moka] }
        binNumber: { type: string }
        price: { type: string }
        iyzico: { type: object, additionalProperties: true }
        moka: { type: object, additionalProperties: true }

    PaymentView:
      type: object
      properties:
        id: { type: string, format: uuid }
        reference: { type: string }
        provider: { type: string, enum: [iyzico, moka] }
        status: { type: string, enum: [pending, success, failed] }
        status_label: { type: string }
        stage: { type: string }
        amount: { type: string }
        paid_amount: { type: string }
        currency: { type: string }
        installment: { type: integer }
        buyer_name: { type: string }
        buyer_surname: { type: string }
        buyer_email: { $ref: "#/components/schemas/Email" }
        buyer_phone: { $ref: "#/components/schemas/Phone" }
        card_holder: { type: string }
        card_display: { type: string }
        card_association: { type: string }
        provider_payment_id: { type: string }
        result_code: { type: string }
        result_message: { type: string }
        auth_code: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time, nullable: true }

    PaymentPage:
      allOf:
        - { $ref: "#/components/schemas/ListPageMeta" }
        - type: object
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/PaymentView" }

    AuditLogView:
      type: object
      properties:
        id: { type: string, format: uuid }
        actor_id: { type: string, format: uuid, nullable: true }
        actor_email: { type: string, nullable: true }
        action: { type: string }
        resource: { type: string }
        resource_id: { type: string, nullable: true }
        ip: { type: string, nullable: true }
        user_agent: { type: string, nullable: true }
        metadata: { type: object, additionalProperties: true, nullable: true }
        change_summary: { type: string, nullable: true, description: "Eski → yeni değer özeti (varsa)" }
        created_at: { type: string }

    AuditLogPage:
      allOf:
        - { $ref: "#/components/schemas/ListPageMeta" }
        - type: object
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/AuditLogView" }

    CalcPaymentAmountRequest:
      type: object
      required: [binNumber, orderAmount]
      properties:
        binNumber: { type: string, minLength: 6, maxLength: 19 }
        orderAmount: { type: number, format: double }
        installmentNumber: { type: integer, minimum: 0, maximum: 12 }
        currency: { type: string, default: TL }
        isThreeD: { type: integer, enum: [0, 1], default: 1 }
        groupRevenueRate: { type: number, format: double }
        groupRevenueAmount: { type: number, format: double }

    CalcPaymentAmountResult:
      type: object
      properties:
        provider: { type: string, enum: [moka] }
        moka:
          type: object
          properties:
            PaymentAmount: { type: number }
            DealerDepositAmount: { type: number }
            DealerCommissionRate: { type: number }
            DealerCommissionAmount: { type: number }

    IyzicoWebhookPayload:
      type: object
      properties:
        paymentConversationId: { type: string }
        merchantId: { type: string }
        paymentId: { type: string }
        status: { type: string }
        iyziReferenceCode: { type: string }
        iyziEventType: { type: string }
        iyziEventTime: { type: integer, format: int64 }
        iyziPaymentId: {}
        token: { type: string }
        orderReferenceCode: { type: string }
        customerReferenceCode: { type: string }
        subscriptionReferenceCode: { type: string }

    IyzicoWebhookResult:
      type: object
      properties:
        verified: { type: boolean }
        acknowledged: { type: boolean }
        reference: { type: string }
        payment_updated: { type: boolean }
        status: { type: string }
        iyzi_reference_code: { type: string }

    IyzicoInit3DSRequest:
      type: object
      required: [price, paidPrice, currency, installment, paymentChannel, basketId, paymentGroup, paymentCard, buyer, shippingAddress, billingAddress, basketItems]
      properties:
        locale: { type: string }
        reference: { type: string, description: "İsteğe bağlı; boşsa sunucu üretir" }
        price: { type: string }
        paidPrice: { type: string }
        currency: { type: string }
        installment: { type: integer }
        paymentChannel: { type: string }
        basketId: { type: string }
        paymentGroup: { type: string }
        paymentCard: { type: object }
        buyer: { type: object }
        shippingAddress: { type: object }
        billingAddress: { type: object }
        basketItems: { type: array, items: { type: object } }

    MokaInit3DSRequest:
      type: object
      required: [cardHolderFullName, cardNumber, expMonth, expYear, cvcNumber, amount]
      properties:
        otherTrxCode: { type: string }
        cardHolderFullName: { type: string }
        cardNumber: { type: string }
        expMonth: { type: string }
        expYear: { type: string }
        cvcNumber: { type: string }
        amount: { type: number, format: double }
        currency: { type: string, default: TL }
        installmentNumber: { type: integer, minimum: 0, maximum: 12 }
        description: { type: string }
        buyerInformation: { type: object }
        isPoolPayment: { type: integer }
        isPreAuth: { type: integer }
        isTokenized: { type: integer }
        redirectType: { type: integer }

    Init3DSResult:
      type: object
      properties:
        provider: { type: string, enum: [iyzico, moka] }
        payment_id: { type: string, format: uuid }
        reference: { type: string }
        threeDSHtmlContent: { type: string, description: "Iyzico base64 HTML" }
        redirectUrl: { type: string, description: "Moka 3DS URL" }
        codeForHash: { type: string, description: "Moka hash doğrulama" }

    Complete3DSRequest:
      type: object
      required: [reference]
      properties:
        reference: { type: string }

    Complete3DSResult:
      type: object
      properties:
        provider: { type: string }
        reference: { type: string }
        status: { type: string }
        payment_id: { type: string }
        auth_code: { type: string }
        result_code: { type: string }
        result_message: { type: string }
        iyzico: { type: object, additionalProperties: true }

    ChangeRoleRequest:
      type: object
      required: [role]
      properties:
        role:
          type: string
          description: Hedef rol adı. Roller dinamiktir; geçerli değerler /api/v1/rbac/roles ile listelenir.
          example: editor

    NotificationRecipient:
      type: object
      description: Kanal türüne göre ilgili alan kullanılır (inapp→email, sms→phone, email→email).
      properties:
        phone: { $ref: "#/components/schemas/Phone" }
        email:
          allOf:
            - { $ref: "#/components/schemas/Email" }
          description: In-app ve email kanallarında alıcı e-postası.
        locale: { type: string, example: tr }

    SendNotificationRequest:
      type: object
      required: [channel, body]
      properties:
        channel: { type: string, enum: [inapp, sms, email] }
        audience:
          type: string
          enum: [one, all]
          description: "one=tek alıcı (recipient), all=tüm aktif kullanıcılar (inapp/email/sms; SMS'te telefonu olmayanlar atlanır)"
        recipient: { $ref: "#/components/schemas/NotificationRecipient" }
        title: { type: string, description: "sms için kullanılmaz" }
        body: { type: string }
        html_body: { type: string, description: "yalnızca email; opsiyonel" }
        locale: { type: string, description: "audience=all: yalnızca bu tercih dilindeki aktif kullanıcılara gider" }

    BulkSendRequest:
      type: object
      required: [channel, body, recipients]
      properties:
        channel: { type: string, enum: [inapp, sms, email] }
        title: { type: string }
        body: { type: string }
        html_body: { type: string }
        locale: { type: string, description: "hedef dil; alıcı dili farklıysa locale_mismatch (kayıtlı kullanıcılar için tercih dili esas alınır)" }
        recipients:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/NotificationRecipient" }

    BulkResult:
      type: object
      properties:
        total: { type: integer, description: "toplam alıcı" }
        accepted: { type: integer, description: "doğrulamayı geçip kuyruğa alınan" }
        invalid:
          type: array
          items:
            type: object
            properties:
              index: { type: integer }
              reason: { type: string, example: "notification.phone_required" }

    UploadBatchResult:
      type: object
      properties:
        message: { type: string, example: "dosyalar yüklendi" }
        total: { type: integer, description: "gönderilen dosya sayısı" }
        accepted: { type: integer, description: "başarıyla yüklenen dosya sayısı" }
        items:
          type: array
          items: { $ref: "#/components/schemas/UploadedFileItem" }
        invalid:
          type: array
          items: { $ref: "#/components/schemas/UploadFailedItem" }

    UploadedFileItem:
      type: object
      properties:
        key: { type: string, description: "depolama anahtarı (UUID + güvenli dosya adı)" }
        filename: { type: string }
        content_type: { type: string, example: "image/png" }
        size: { type: integer, format: int64, description: "bayt cinsinden boyut" }

    UploadFailedItem:
      type: object
      properties:
        index: { type: integer }
        filename: { type: string }
        reason: { type: string, example: "upload.too_large" }
        detail: { type: string }

    PermissionView:
      type: object
      properties:
        name: { type: string, example: "users:list" }
        description: { type: string }

    RoleView:
      type: object
      properties:
        name: { type: string, example: editor }
        description: { type: string }
        is_system: { type: boolean }
        permissions:
          type: array
          items: { type: string }

    CreateRoleRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 2, maxLength: 32, example: editor }
        description: { type: string, maxLength: 255 }
        permissions:
          type: array
          items: { type: string }

    UpdateRoleRequest:
      type: object
      properties:
        description: { type: string, maxLength: 255 }

    SetPermissionsRequest:
      type: object
      required: [permissions]
      properties:
        permissions:
          type: array
          items: { type: string }

    MeView:
      allOf:
        - { $ref: "#/components/schemas/UserView" }
        - type: object
          properties:
            permissions:
              type: array
              items: { type: string }
              description: Rolün sahip olduğu izinler (ör. users:list)

    TokenPair:
      type: object
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        expires_at: { type: string, format: date-time }
        token_type: { type: string, example: Bearer }

    UserView:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { $ref: "#/components/schemas/Email" }
        phone: { $ref: "#/components/schemas/Phone" }
        name: { type: string }
        role: { type: string, description: "Dinamik rol adı (ör. admin, user, editor)" }
        active: { type: boolean }
        email_verified: { type: boolean }
        mfa_enabled: { type: boolean }
        preferred_locale:
          type: string
          example: tr
          description: Bildirim e-postaları için kalıcı dil tercihi
        created_at: { type: string, format: date-time }
